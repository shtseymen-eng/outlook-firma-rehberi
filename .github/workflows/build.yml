name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versiyon (orn: 4.0)'
        required: false
        default: '4.0'

permissions:
  contents: write

jobs:
  build:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pywin32 openpyxl pyinstaller

      - name: Get version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match 'refs/tags/v([\d.]+)') {
            $v = $Matches[1]
          } elseif ('${{ github.event.inputs.version }}' -ne '') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = '4.0'
          }
          "VERSION=$v" >> $env:GITHUB_OUTPUT
          "TAG=v$v"    >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Verify icon exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'assets\icon.ico')) {
            Write-Error "assets\icon.ico bulunamadi!"
            exit 1
          }
          $iconSize = (Get-Item 'assets\icon.ico').Length / 1KB
          Write-Host "Icon: assets\icon.ico - $([math]::Round($iconSize,1)) KB"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller OutlookFirmaRehberi.spec --clean --noconfirm
          if (-not (Test-Path 'dist\OutlookFirmaRehberi.exe')) {
            Write-Error "EXE olusturulamadi!"
            exit 1
          }
          $size = (Get-Item 'dist\OutlookFirmaRehberi.exe').Length / 1MB
          Write-Host "EXE boyutu: $([math]::Round($size,1)) MB"

      - name: Find Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error "Inno Setup bulunamadi!"; exit 1 }
          Write-Host "ISCC: $iscc"
          "ISCC=$iscc" >> $env:GITHUB_OUTPUT

      - name: Patch version in ISS
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.VERSION }}'
          $raw = Get-Content setup.iss -Raw -Encoding UTF8
          $raw = $raw -replace '(#define AppVersion\s+)"[\d.]+"', "`$1`"$v`""
          $raw = $raw -replace '(OutputBaseFilename\s*=\s*)[\w.]+', "`${1}OutlookFirmaRehberi_v${v}_Setup"
          Set-Content setup.iss -Value $raw -Encoding UTF8
          Write-Host "Patched version to $v"

      - name: Build Installer
        shell: pwsh
        run: |
          $iscc = '${{ steps.inno.outputs.ISCC }}'
          & $iscc setup.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup failed"; exit 1 }
          $f = Get-Item "dist\OutlookFirmaRehberi_*_Setup.exe" | Select-Object -First 1
          Write-Host "Setup: $($f.Name) - $([math]::Round($f.Length/1MB,1)) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OutlookFirmaRehberi-Setup-${{ steps.ver.outputs.TAG }}
          path: dist\OutlookFirmaRehberi_*_Setup.exe
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Outlook Firma Rehberi ${{ steps.ver.outputs.TAG }}
          tag_name: ${{ steps.ver.outputs.TAG }}
          files: dist\OutlookFirmaRehberi_*_Setup.exe
          generate_release_notes: false
          body: |
            ## Outlook Firma Rehberi ${{ steps.ver.outputs.TAG }}

            Kurulum: Setup.exe dosyasini indirip cift tiklayin.
            Outlook acik olmali.

            - Tum hesaplar + tum alt klasorler taranir
            - Imzadan firma, isim, cep tel otomatik
            - Tekrarsiz mail adresleri
            - Excel cikti (Ozet + Kurumsal + Kisisel)

            Poliport - S.SEYMEN
