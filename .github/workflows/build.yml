name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 5.0.0"
        required: false
        default: "5.0.0"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,build]"
      - name: Configure public Microsoft client id
        shell: pwsh
        env:
          CLIENT_ID: ${{ vars.OUTLOOK_REHBERI_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLIENT_ID)) {
            throw "Repository variable OUTLOOK_REHBERI_CLIENT_ID is required."
          }
          @{ client_id = $env:CLIENT_ID } | ConvertTo-Json | Set-Content outlook_rehberi/app_config.json -Encoding UTF8
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $version = $Matches[1] }
          elseif ('${{ inputs.version }}') { $version = '${{ inputs.version }}' }
          else { $version = '5.0.0' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build application
        run: pyinstaller packaging/OutlookFirmaRehberi.windows.spec --clean --noconfirm
      - name: Smoke launch application
        run: python scripts/smoke_launch.py --executable dist\OutlookFirmaRehberi.exe
      - name: Sign application when configured
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("windows-cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f windows-cert.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD dist\OutlookFirmaRehberi.exe
          Remove-Item windows-cert.pfx
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }
      - name: Sign installer when configured
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("windows-cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f windows-cert.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD dist\OutlookFirmaRehberi_v${{ steps.version.outputs.value }}_Windows_x64_Setup.exe
          Remove-Item windows-cert.pfx
      - name: Create checksum
        shell: pwsh
        run: |
          $file = "dist\OutlookFirmaRehberi_v${{ steps.version.outputs.value }}_Windows_x64_Setup.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash *$([IO.Path]::GetFileName($file))" | Set-Content "$file.sha256" -Encoding ASCII
      - uses: actions/upload-artifact@v4
        with:
          name: OutlookFirmaRehberi-Windows-x64
          path: |
            dist/OutlookFirmaRehberi_v${{ steps.version.outputs.value }}_Windows_x64_Setup.exe
            dist/OutlookFirmaRehberi_v${{ steps.version.outputs.value }}_Windows_x64_Setup.exe.sha256

  macos:
    name: macOS ${{ matrix.arch }}
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: AppleSilicon
          - runner: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,build]"
      - name: Configure public Microsoft client id
        env:
          CLIENT_ID: ${{ vars.OUTLOOK_REHBERI_CLIENT_ID }}
        run: |
          test -n "$CLIENT_ID"
          python -c 'import json, os, pathlib; pathlib.Path("outlook_rehberi/app_config.json").write_text(json.dumps({"client_id": os.environ["CLIENT_ID"]}), encoding="utf-8")'
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF#refs/tags/v}"; else version="${{ inputs.version || '5.0.0' }}"; fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build icon and application
        env:
          OUTLOOK_REHBERI_VERSION: ${{ steps.version.outputs.value }}
        run: |
          scripts/build_macos_icon.sh
          pyinstaller packaging/OutlookFirmaRehberi.macos.spec --clean --noconfirm
      - name: Smoke launch application
        run: python scripts/smoke_launch.py --executable "dist/Outlook Firma Rehberi.app/Contents/MacOS/OutlookFirmaRehberi"
      - name: Import Apple signing certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          certificate_path="$RUNNER_TEMP/apple-cert.p12"
          keychain_path="$RUNNER_TEMP/build.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p actions "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p actions "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          codesign --deep --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "dist/Outlook Firma Rehberi.app"
      - name: Build disk image
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARCH: ${{ matrix.arch }}
        run: |
          dmg="dist/OutlookFirmaRehberi_v${VERSION}_macOS_${ARCH}.dmg"
          hdiutil create -volname "Outlook Firma Rehberi" -srcfolder "dist/Outlook Firma Rehberi.app" -ov -format UDZO "$dmg"
      - name: Sign and notarize when configured
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          VERSION: ${{ steps.version.outputs.value }}
          ARCH: ${{ matrix.arch }}
        run: |
          dmg="dist/OutlookFirmaRehberi_v${VERSION}_macOS_${ARCH}.dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple "$dmg"
      - name: Create checksum
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARCH: ${{ matrix.arch }}
        run: |
          dmg="dist/OutlookFirmaRehberi_v${VERSION}_macOS_${ARCH}.dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: OutlookFirmaRehberi-macOS-${{ matrix.arch }}
          path: |
            dist/OutlookFirmaRehberi_v${{ steps.version.outputs.value }}_macOS_${{ matrix.arch }}.dmg
            dist/OutlookFirmaRehberi_v${{ steps.version.outputs.value }}_macOS_${{ matrix.arch }}.dmg.sha256

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
