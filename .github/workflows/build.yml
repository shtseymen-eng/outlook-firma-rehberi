name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versiyon (orn: 4.0)'
        required: false
        default: '4.0'

permissions:
  contents: write

jobs:
  build:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pywin32 openpyxl pyinstaller

      - name: Get version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match 'refs/tags/v([\d.]+)') {
            $v = $Matches[1]
          } elseif ('${{ github.event.inputs.version }}' -ne '') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = '4.0'
          }
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT
          echo "TAG=v$v"    >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller OutlookFirmaRehberi.spec --clean --noconfirm
          if (-not (Test-Path 'dist\OutlookFirmaRehberi.exe')) {
            Write-Error "EXE olusturulamadi!"
            exit 1
          }
          $size = (Get-Item 'dist\OutlookFirmaRehberi.exe').Length / 1MB
          Write-Host "EXE boyutu: $([math]::Round($size,1)) MB"

      - name: Install Inno Setup 6
        run: choco install innosetup --version=6.3.3 -y --no-progress

      - name: Patch version in ISS
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.VERSION }}'
          $content = Get-Content setup.iss -Raw -Encoding UTF8
          $content = $content -replace '#define AppVersion\s+"[\d.]+"', "#define AppVersion   `"$v`""
          $content = $content -replace 'OutputBaseFilename\s+=\s+\S+', "OutputBaseFilename       = OutlookFirmaRehberi_v${v}_Setup"
          Set-Content setup.iss $content -Encoding UTF8
          Write-Host "ISS version: $v"

      - name: Build Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $setup = Get-Item "dist\OutlookFirmaRehberi_*.exe" | Select-Object -First 1
          Write-Host "Setup: $($setup.Name) - $([math]::Round($setup.Length/1MB,1)) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OutlookFirmaRehberi-Setup-${{ steps.ver.outputs.TAG }}
          path: dist\OutlookFirmaRehberi_*_Setup.exe
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Outlook Firma Rehberi ${{ steps.ver.outputs.TAG }}
          tag_name: ${{ steps.ver.outputs.TAG }}
          files: dist\OutlookFirmaRehberi_*_Setup.exe
          generate_release_notes: false
          body: |
            ## Outlook Firma Rehberi ${{ steps.ver.outputs.TAG }}

            ### Kurulum
            1. `OutlookFirmaRehberi_v${{ steps.ver.outputs.VERSION }}_Setup.exe` dosyasini indirin
            2. Cift tiklayin, kurulum sihirbazini tamamlayin
            3. Masaustu kisayolundan acin

            > Outlook acik ve oturum acik olmali.

            ### Ozellikler
            - Tum Outlook hesaplari taranir
            - Gelen + Gonderilen + Silinmis + tum alt klasorler
            - Imzadan firma adi, cep telefonu, unvan
            - Ayni mail adresi tek seferinde kaydedilir
            - Excel disa aktarma (Ozet + Kurumsal + Kisisel)
            - Artimli tarama

            ---
            Poliport - S.SEYMEN
