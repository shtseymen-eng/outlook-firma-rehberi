name: Outlook Web Pages
on:
  push:
    branches: [main]
    paths: ['web/**', 'mac_helper/**', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: outlook-web-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s mac_helper -p 'test_*.py'
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_OUTLOOK_REHBERI_CLIENT_ID: ${{ vars.OUTLOOK_REHBERI_CLIENT_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
